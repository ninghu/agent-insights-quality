schema_version: "1.0.0"
policy_version: "1.1.0"
default_mode: rotating_daily
cycle:
  epoch_monday: "2026-01-05"
  business_days: 5
  weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday]
  partition_scenario_counts: [9, 10, 9, 10, 9]
selection:
  healthy_controls_daily: true
  mandatory_fault_priorities: [P0]
  scenario_cadence:
    aiq-scn-062-umbrella-insight: [Monday, Wednesday, Friday]
  rotating_fault_priorities: [P1, P2]
  priority_order: [P0, P1, P2]
  required_fault_categories:
    - tool_call_failures
    - latency
    - cost_tokens
    - reliability_errors
    - hallucinations
    - output_quality
    - context_memory
    - safety_guardrails
limits:
  daily_fault_scenario_count: 20
  daily_expected_root_count: 20
  expected_insight_cap_per_agent: 4
  expected_root_cap_per_run: 4
  actual_insight_count_rule: exact_expected
full_catalog:
  explicit_only: true
  human_daily_contract: false
scheduled_automation:
  weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday]
  full_catalog: false
