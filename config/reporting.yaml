schema_version: "1.0.0"
recipient_mode: authenticated_user
allowed_domain: microsoft.com
email_channel: copilot_email
send_once: true
retry_ambiguous: false
quality_score:
  formula: field_weighted_v1
  field_quality_weight: 0.85
  clean_card_precision_weight: 0.15
  field_weights:
    root_cause: 0.25
    title: 0.10
    description: 0.15
    category: 0.10
    severity: 0.10
    proposed_fix: 0.15
    linked_traces: 0.15
  pass_threshold: 90
