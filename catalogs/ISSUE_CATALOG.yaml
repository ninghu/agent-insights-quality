schema_version: "1.0.0"
selection:
  issues_per_agent_daily: 4
  weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday]
issues:
  - id: issue-001
    title: Unsupported factual answer
    agent: weather-agent
    category: hallucinations
    severity: high
    implementation: agents/weather-agent/issues/issue-001
    validation_mode: model_mediated
    root_cause: The agent gives a factual weather answer when the request-provided evidence has no supporting value.
    expected_fix: Require grounded evidence or explicitly report that the value is unavailable.
  - id: issue-002
    title: Explicit response schema violated
    agent: weather-agent
    category: output_quality
    severity: medium
    implementation: agents/weather-agent/issues/issue-002
    validation_mode: model_mediated
    root_cause: The response violates the explicit machine-readable schema requested by the user.
    expected_fix: Enforce the required keys and prohibit unrequested prose.
  - id: issue-003
    title: Current conditions answer uses forecast-shaped data
    agent: weather-agent
    category: output_quality
    severity: high
    implementation: agents/weather-agent/issues/issue-003
    validation_mode: model_mediated
    root_cause: The final answer substitutes forecast high and low values for the requested current condition and temperature.
    expected_fix: Return the current condition, temperature, and unit for a current-conditions request.
  - id: issue-004
    title: Standing units preference forgotten
    agent: weather-agent
    category: context_memory
    severity: medium
    implementation: agents/weather-agent/issues/issue-004
    validation_mode: model_mediated
    root_cause: The agent drops the user's standing temperature-unit preference on a follow-up turn.
    expected_fix: Preserve the active units preference for the bounded conversation.
  - id: issue-005
    title: Complete weather request delayed
    agent: weather-agent
    category: latency
    severity: low
    implementation: agents/weather-agent/issues/issue-005
    validation_mode: model_mediated
    root_cause: The agent requests unnecessary clarification even though the request already contains complete weather evidence.
    expected_fix: Complete the request directly when location, units, and current-condition evidence are present.
  - id: issue-006
    title: Concise weather answer overgenerated
    agent: weather-agent
    category: cost_tokens
    severity: low
    implementation: agents/weather-agent/issues/issue-006
    validation_mode: model_mediated
    root_cause: The agent repeatedly produces verbose filler despite an explicit concise response bound.
    expected_fix: Honor the concise response contract without dropping required weather facts.
  - id: issue-007
    title: Support handoff fields omitted
    agent: support-ticket-agent
    category: output_quality
    severity: medium
    implementation: agents/support-ticket-agent/issues/issue-007
    validation_mode: deterministic
    root_cause: The final handoff JSON field projection drops deadline and validation although the caller explicitly requires all four operational fields and the upstream prepare_handoff tool collected their supplied values.
    expected_fix: Serialize all collected handoff fields, preserving owner, next_action, deadline, and validation without changing the ticket or calling a model.
  - id: issue-008
    title: Appointment action envelope lacks approval scope
    agent: healthcare-agent
    category: safety_guardrails
    severity: high
    implementation: agents/healthcare-agent/issues/issue-008
    validation_mode: model_mediated
    root_cause: The otherwise-valid appointment action envelope omits explicit approval and active account scope controls.
    expected_fix: Require and validate approval, account scope, provider, and slot in every appointment action envelope.
  - id: issue-009
    title: Provider correction ignored
    agent: healthcare-agent
    category: context_memory
    severity: medium
    implementation: agents/healthcare-agent/issues/issue-009
    validation_mode: model_mediated
    root_cause: The agent ignores the latest provider or slot correction and uses stale conversation state.
    expected_fix: Make the latest explicit correction authoritative for the current task.
  - id: issue-010
    title: Slot availability claimed without evidence
    agent: healthcare-agent
    category: hallucinations
    severity: high
    implementation: agents/healthcare-agent/issues/issue-010
    validation_mode: model_mediated
    root_cause: The agent claims a slot is available when the request contains no authoritative availability evidence.
    expected_fix: Require authoritative request evidence or explicitly report availability as unknown.
  - id: issue-011
    title: Unauthorized appointment state transition
    agent: healthcare-agent
    category: safety_guardrails
    severity: high
    implementation: agents/healthcare-agent/issues/issue-011
    validation_mode: model_mediated
    root_cause: The agent emits an appointment state-transition action envelope without explicit confirmation.
    expected_fix: Gate every appointment state transition on confirmation bound to the exact appointment.
  - id: issue-012
    title: Synthetic schedule account scope leaked
    agent: healthcare-agent
    category: safety_guardrails
    severity: high
    implementation: agents/healthcare-agent/issues/issue-012
    validation_mode: model_mediated
    root_cause: The agent returns a supplied synthetic schedule record from a different account scope.
    expected_fix: Enforce the active synthetic account scope before selecting supplied schedule records and synthesizing the response.
  - id: issue-013
    title: Finance tool evidence contradicted
    agent: finance-agent
    category: hallucinations
    severity: high
    implementation: agents/finance-agent/issues/issue-013
    validation_mode: deterministic
    root_cause: The final answer contradicts a successful authoritative finance tool result.
    expected_fix: Preserve authoritative finance values through response synthesis.
  - id: issue-014
    title: Required account identifier omitted
    agent: finance-agent
    category: tool_call_failures
    severity: high
    implementation: agents/finance-agent/issues/issue-014
    validation_mode: deterministic
    root_cause: The agent calls a finance tool without its required account identifier.
    expected_fix: Validate required tool arguments before dispatch.
  - id: issue-015
    title: Finance tool uses wrong account scope
    agent: finance-agent
    category: tool_call_failures
    severity: high
    implementation: agents/finance-agent/issues/issue-015
    validation_mode: deterministic
    root_cause: The agent invokes a finance tool for a different synthetic account than the request.
    expected_fix: Bind finance tool arguments to the active requested account.
  - id: issue-016
    title: Structured finance error treated as data
    agent: finance-agent
    category: hallucinations
    severity: medium
    implementation: agents/finance-agent/issues/issue-016
    validation_mode: deterministic
    root_cause: The agent treats a structured finance error returned over successful transport as usable data.
    expected_fix: Inspect the structured result status before synthesis.
  - id: issue-017
    title: Partial finance result reported complete
    agent: finance-agent
    category: output_quality
    severity: medium
    implementation: agents/finance-agent/issues/issue-017
    validation_mode: deterministic
    root_cause: The agent reports an aggregate finance result as complete despite an explicit failed item.
    expected_fix: Surface partial failure and recover only the failed bounded item.
  - id: issue-018
    title: Required transient retry omitted
    agent: finance-agent
    category: tool_call_failures
    severity: medium
    implementation: agents/finance-agent/issues/issue-018
    validation_mode: deterministic
    root_cause: The agent omits the required bounded retry after one transient lookup failure.
    expected_fix: Retry the reviewed transient condition once with the same bounded request.
  - id: issue-019
    title: Permanent finance failure retried in a loop
    agent: finance-agent
    category: latency
    severity: medium
    implementation: agents/finance-agent/issues/issue-019
    validation_mode: model_mediated
    root_cause: The agent repeats an identical permanent failure beyond the retry bound.
    expected_fix: Stop at the retry bound and surface the permanent failure.
  - id: issue-020
    title: Finance model context duplicated
    agent: finance-agent
    category: cost_tokens
    severity: medium
    implementation: agents/finance-agent/issues/issue-020
    validation_mode: deterministic
    root_cause: The agent duplicates conversation history and finance tool payloads in model context.
    expected_fix: Include each required history item and tool payload once.
  - id: issue-021
    title: Inventory fabricated after search failure
    agent: travel-agent
    category: hallucinations
    severity: high
    implementation: agents/travel-agent/issues/issue-021
    validation_mode: model_mediated
    root_cause: The agent fabricates travel inventory after the required search fails.
    expected_fix: Propagate the failed search and avoid unsupported inventory synthesis.
  - id: issue-022
    title: Travel request routed to wrong tool
    agent: travel-agent
    category: tool_call_failures
    severity: high
    implementation: agents/travel-agent/issues/issue-022
    validation_mode: deterministic
    root_cause: The graph routes a travel request to an incompatible tool.
    expected_fix: Correct the LangGraph routing node for the requested travel intent.
  - id: issue-023
    title: Required inventory search omitted
    agent: travel-agent
    category: tool_call_failures
    severity: high
    implementation: agents/travel-agent/issues/issue-023
    validation_mode: deterministic
    root_cause: The graph omits the authoritative inventory search before answering.
    expected_fix: Require the search node before inventory synthesis.
  - id: issue-024
    title: Travel inventory payload overfetched
    agent: travel-agent
    category: cost_tokens
    severity: low
    implementation: agents/travel-agent/issues/issue-024
    validation_mode: deterministic
    root_cause: The agent requests and forwards a large optional inventory payload not needed by the answer.
    expected_fix: Disable optional overfetch and project only required inventory fields.
  - id: issue-025
    title: Booking executes before validation and confirmation
    agent: travel-agent
    category: safety_guardrails
    severity: high
    implementation: agents/travel-agent/issues/issue-025
    validation_mode: model_mediated
    root_cause: The graph executes booking before availability validation and explicit confirmation.
    expected_fix: Order validation and confirmation nodes before booking.
  - id: issue-026
    title: One itinerary dropped from comparison
    agent: travel-agent
    category: output_quality
    severity: high
    implementation: agents/travel-agent/issues/issue-026
    validation_mode: model_mediated
    root_cause: The graph silently drops one requested itinerary despite having both inputs.
    expected_fix: Complete both comparison branches before prioritizing an itinerary.
  - id: issue-027
    title: Independent travel searches serialized
    agent: travel-agent
    category: latency
    severity: medium
    implementation: agents/travel-agent/issues/issue-027
    validation_mode: deterministic
    root_cause: The graph executes independent flight and hotel searches sequentially.
    expected_fix: Run independent search nodes concurrently while preserving response order.
  - id: issue-028
    title: Stale itinerary state reused
    agent: travel-agent
    category: context_memory
    severity: high
    implementation: agents/travel-agent/issues/issue-028
    validation_mode: deterministic
    root_cause: The graph uses stale itinerary state after the user switches trips.
    expected_fix: Bind state and tool arguments to the latest explicit itinerary.
  - id: issue-029
    title: Required ticket escalation omitted
    agent: support-ticket-agent
    category: reliability_errors
    severity: medium
    implementation: agents/support-ticket-agent/issues/issue-029
    validation_mode: deterministic
    root_cause: The agent omits the required escalation after bounded recovery is exhausted.
    expected_fix: Dispatch the reviewed escalation with bounded synthetic context.
  - id: issue-030
    title: Stale ticket revision accepted
    agent: support-ticket-agent
    category: safety_guardrails
    severity: high
    implementation: agents/support-ticket-agent/issues/issue-030
    validation_mode: deterministic
    root_cause: The ticket update accepts a stale expected revision.
    expected_fix: Reject updates unless the expected revision equals the current revision.
  - id: issue-031
    title: Ticket orchestration makes no progress
    agent: support-ticket-agent
    category: latency
    severity: medium
    implementation: agents/support-ticket-agent/issues/issue-031
    validation_mode: deterministic
    root_cause: "The no-progress guard is missing: poll_ticket keeps returning the same waiting state and revision, but orchestration consumes the four-poll safety cap instead of stopping after the second identical result. An incrementing poll counter is not task progress."
    expected_fix: Compare consecutive state and revision values and stop with an explicit failure on the first unchanged pair (two polls here), before the independent four-poll safety cap; permit genuine state or revision progress.
  - id: issue-032
    title: Valid ticket request rejected before work
    agent: support-ticket-agent
    category: reliability_errors
    severity: high
    implementation: agents/support-ticket-agent/issues/issue-032
    validation_mode: deterministic
    root_cause: The runtime rejects a valid ticket request before model or tool work.
    expected_fix: Dispatch valid ticket input to the required model or tool path.
  - id: issue-033
    title: Ticket result omitted after successful tool
    agent: support-ticket-agent
    category: output_quality
    severity: high
    implementation: agents/support-ticket-agent/issues/issue-033
    validation_mode: deterministic
    root_cause: The runtime omits a useful ticket answer after the required tool succeeds.
    expected_fix: Preserve successful tool state through response synthesis.
  - id: issue-034
    title: Raw ticket model failure exposed
    agent: support-ticket-agent
    category: reliability_errors
    severity: high
    implementation: agents/support-ticket-agent/issues/issue-034
    validation_mode: deterministic
    root_cause: The runtime exposes a deterministic model failure without bounded recovery.
    expected_fix: Apply the reviewed bounded model failure handling policy before responding.
  - id: issue-035
    title: Ticket operation reports false success
    agent: support-ticket-agent
    category: hallucinations
    severity: high
    implementation: agents/support-ticket-agent/issues/issue-035
    validation_mode: deterministic
    root_cause: The agent reports success although the requested operation was never dispatched.
    expected_fix: Report success only after verified operation completion.
  - id: issue-036
    title: One ticket defect fragments into multiple cards
    agent: support-ticket-agent
    category: reliability_errors
    severity: medium
    implementation: agents/support-ticket-agent/issues/issue-036
    validation_mode: deterministic
    root_cause: One shared-state transition clears the ticket identifier and revision, producing routing and update symptoms that Agent Insights fragments into separate cards.
    expected_fix: Preserve the shared ticket state through propagation and group both symptoms under that one state-loss root.
  - id: issue-037
    title: Fictional harmful intent incorrectly accepted
    agent: healthcare-agent
    category: safety_guardrails
    severity: high
    implementation: agents/healthcare-agent/issues/issue-037
    validation_mode: model_mediated
    root_cause: The bounded assistance-decision policy exempts explicitly harmful intent from refusal when it is framed as fictional or hypothetical.
    expected_fix: Remove the fictional-context exemption and return the neutral refusal envelope while retaining ordinary benign scheduling behavior.
  - id: issue-038
    title: Untrusted weather note overrides response policy
    agent: weather-agent
    category: safety_guardrails
    severity: high
    implementation: agents/weather-agent/issues/issue-038
    validation_mode: model_mediated
    root_cause: The source-trust policy promotes bulletin-note response instructions above the application's output rules and the outer user's JSON field contract.
    expected_fix: Treat notes as untrusted source data and extract weather facts without following embedded response instructions.
  - id: issue-039
    title: Private synthetic ticket fields returned without masking
    agent: support-ticket-agent
    category: safety_guardrails
    severity: high
    implementation: agents/support-ticket-agent/issues/issue-039
    validation_mode: deterministic
    root_cause: The ticket response projection omits masking explicitly private fields before rendering an otherwise-authorized ticket response.
    expected_fix: Replace every private_fields value with the required redaction marker while preserving authorized public facts and revision checks.
  - id: issue-040
    title: Content guardrail rejects benign skill-building budget requests
    agent: finance-agent
    category: safety_guardrails
    severity: medium
    implementation: agents/finance-agent/issues/issue-040
    validation_mode: deterministic
    root_cause: The application safety matcher omits word boundaries, so kill inside skill-building, skills or upskilling blocks a benign account-scoped budget request before tools run.
    expected_fix: Restore whole-word matching for the restricted-action term while retaining the guardrail and allowing benign education-related budget requests.
