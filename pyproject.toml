[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-insights-quality"
version = "0.1.0"
description = "Repository contracts and automation for daily Agent Insights quality qualification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "opentelemetry-sdk>=1.35,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]
azure = [
  "azure-monitor-query>=1.4,<2",
  "azure-storage-blob>=12.26,<13",
]

[project.scripts]
aiq-quality = "agent_insights_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_insights_quality = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
