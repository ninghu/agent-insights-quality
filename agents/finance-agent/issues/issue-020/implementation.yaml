contract_version: '1.0'
issue_id: issue-020
agent_name: finance-agent
framework: microsoft-agent-framework-python
deployment:
  kind: foundry_hosted_code
  baseline: ../../v0
  protocol: responses
  port: 8088
  entrypoint: python -m source.app
category: cost_tokens
severity: medium
expected_behavior:
  desired: Send one bounded copy of request and tool evidence to the model.
  injected: Duplicates the full model context four times.
injected_defect:
  single_root: Context construction concatenates four identical payload copies.
  activation: all_matching_endpoint_requests
packaging:
  command: python ../../v0/package.py --issue implementation.yaml --output issue-020.zip
  runtime_config: issue.yaml
  include_exactly_one_issue: true
  exclude:
  - ../../issues
determinism:
  traffic_file: traffic.json
  minimum_requests: 5
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
