contract_version: '1.0'
issue_id: issue-017
agent_name: finance-agent
framework: microsoft-agent-framework-python
deployment:
  kind: foundry_hosted_code
  baseline: ../../v0
  protocol: responses
  port: 8088
  entrypoint: python -m source.app
category: output_quality
severity: medium
expected_behavior:
  desired: Mark an aggregate result partial when any item fails.
  injected: Reports a multi-item result complete despite one failed item.
injected_defect:
  single_root: Issue-specific orchestration labels a mixed-result aggregate complete.
  activation: all_matching_endpoint_requests
packaging:
  command: python ../../v0/package.py --issue implementation.yaml --output issue-017.zip
  runtime_config: issue.yaml
  include_exactly_one_issue: true
  exclude:
  - ../../issues
determinism:
  traffic_file: traffic.json
  minimum_requests: 5
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
