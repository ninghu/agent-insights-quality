contract_version: '1.0'
issue_id: v0
agent_name: support-ticket-agent
framework: custom-python-responses
deployment:
  kind: foundry_hosted_custom_container
  protocol: responses
  build_file: Dockerfile
  port: 8088
category: baseline
severity: none
expected_behavior:
  desired: Grounded success with bounded work and handled recoverable failures.
  injected: No defect is enabled.
