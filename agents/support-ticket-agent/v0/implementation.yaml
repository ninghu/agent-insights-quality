artifacts:
  include:
  - implementation.yaml
  - package.py
  - requirements.txt
  - source
  - traffic.json
  - Dockerfile
  - container.yaml
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
