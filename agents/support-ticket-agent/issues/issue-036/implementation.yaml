contract_version: '1.0'
issue_id: issue-036
agent_name: support-ticket-agent
framework: custom-python-responses
deployment:
  kind: foundry_hosted_custom_container
  baseline: ../../v0
  protocol: responses
  port: 8088
  build_file: ../../v0/Dockerfile
category: reliability_errors
severity: medium
expected_behavior:
  desired: Preserve shared ticket and revision state across all steps.
  injected: Loses shared state and produces several downstream symptoms.
injected_defect:
  single_root: One propagation transition replaces shared state with an empty mapping.
  activation: all_matching_endpoint_requests
packaging:
  command: python ../../v0/package.py --issue implementation.yaml --output issue-036.zip
  runtime_config: issue.yaml
  include_exactly_one_issue: true
  exclude:
  - ../../issues
determinism:
  traffic_file: traffic.json
  minimum_requests: 5
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
