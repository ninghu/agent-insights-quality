schema_version: "1.0.0"
id: aiq-001-weather
required_name_prefix: aiq-001-weather
display_name: Weather
domain: weather
agent_type: prompt
status: active
healthy_contract:
  responsibility: Resolve locations and provide grounded current or forecast weather efficiently.
  immutable: true
  synthetic_data_only: true
  expected_baseline_insights: 0
implementation:
  source_path: agents/weather-prompt
  version_strategy: immutable_digest
  deployment_protocol: foundry_prompt_version_rest
  representative_tools:
    - geocode
    - current_weather
    - forecast
endpoint_traffic:
  invoke_deployed_endpoint: true
  application_insights_access: read_only
  direct_trace_injection: forbidden
correlation:
  invocation_response_ids_are_trace_ids: false
  trace_correlation_source: application_insights_operation_id
compatible_scenario_tags:
  - prompt
  - grounding
  - tools
  - latency
