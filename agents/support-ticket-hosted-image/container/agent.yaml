name: aiq-005-ticket
image:
  repository: ghcr.io/ninghu/agent-insights-quality-ticket
  digest_variable: AIQ_TICKET_IMAGE_DIGEST
  required_reference_format: repository@sha256
platform: linux/amd64
resources:
  cpu: "1"
  memory: 2Gi
protocols:
  - protocol: responses
    version: "1.0.0"
health:
  readiness_path: /readiness
  port: 8088
