schema_version: "1.0.0"
id: aiq-005-ticket
required_name_prefix: aiq-005-ticket
display_name: Support ticket
domain: support_ticket
agent_type: hosted_custom_container
status: active
healthy_contract:
  responsibility: Triage and update synthetic tickets with current-ticket grounding and bounded escalation.
  immutable: true
  synthetic_data_only: true
  expected_baseline_insights: 0
implementation:
  source_path: agents/support-ticket-hosted-image
  version_strategy: immutable_digest
  deployment_protocol: foundry_hosted_container_json
  representative_tools:
    - ticket_read
    - ticket_update
    - customer_context
    - escalation
endpoint_traffic:
  invoke_deployed_endpoint: true
  application_insights_access: read_only
  direct_trace_injection: forbidden
correlation:
  invocation_response_ids_are_trace_ids: false
  trace_correlation_source: application_insights_operation_id
compatible_scenario_tags:
  - hosted_custom_container
  - context
  - reliability
  - tools
