contract_version: '1.0'
issue_id: issue-027
agent_name: travel-agent
framework: langgraph-python
deployment:
  kind: foundry_hosted_code
  baseline: ../../v0
  protocol: responses
  port: 8088
  entrypoint: python -m source.app
category: latency
severity: medium
expected_behavior:
  desired: Execute independent flight and hotel searches concurrently.
  injected: Executes independent searches sequentially.
injected_defect:
  single_root: The graph search node awaits flight before starting hotel.
  activation: all_matching_endpoint_requests
packaging:
  command: python ../../v0/package.py --issue implementation.yaml --output issue-027.zip
  runtime_config: issue.yaml
  include_exactly_one_issue: true
  exclude:
  - ../../issues
determinism:
  traffic_file: traffic.json
  minimum_requests: 5
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
