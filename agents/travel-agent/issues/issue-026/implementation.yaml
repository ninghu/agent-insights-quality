contract_version: '1.0'
issue_id: issue-026
agent_name: travel-agent
framework: langgraph-python
deployment:
  kind: foundry_hosted_code
  baseline: ../../v0
  protocol: responses
  port: 8088
  entrypoint: python -m source.app
category: output_quality
severity: high
expected_behavior:
  desired: Complete both requested itinerary comparison branches.
  injected: Returns only one branch of a two-part comparison.
injected_defect:
  single_root: Comparison assembly truncates the combined inventory to one item.
  activation: all_matching_endpoint_requests
packaging:
  command: python ../../v0/package.py --issue implementation.yaml --output issue-026.zip
  runtime_config: issue.yaml
  include_exactly_one_issue: true
  exclude:
  - ../../issues
determinism:
  traffic_file: traffic.json
  minimum_requests: 5
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
