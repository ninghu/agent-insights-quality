contract_version: '1.0'
issue_id: issue-024
agent_name: travel-agent
framework: langgraph-python
deployment:
  kind: foundry_hosted_code
  baseline: ../../v0
  protocol: responses
  port: 8088
  entrypoint: python -m source.app
category: cost_tokens
severity: low
expected_behavior:
  desired: Request only the compact inventory fields needed.
  injected: Requests a large optional inventory payload that is unused.
injected_defect:
  single_root: Both search tools enable expanded details and return 80 items each.
  activation: all_matching_endpoint_requests
packaging:
  command: python ../../v0/package.py --issue implementation.yaml --output issue-024.zip
  runtime_config: issue.yaml
  include_exactly_one_issue: true
  exclude:
  - ../../issues
determinism:
  traffic_file: traffic.json
  minimum_requests: 5
public_safety:
  synthetic_only: true
  real_people: false
  credentials: false
  service_locations: false
