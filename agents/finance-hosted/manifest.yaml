schema_version: "1.0.0"
id: aiq-003-finance
required_name_prefix: aiq-003-finance
display_name: Finance
domain: finance
agent_type: hosted_code
status: active
healthy_contract:
  responsibility: Explain synthetic account activity and prepare bounded budgets without executing transfers.
  immutable: true
  synthetic_data_only: true
  expected_baseline_insights: 0
implementation:
  source_path: agents/finance-hosted
  version_strategy: immutable_digest
  deployment_protocol: foundry_hosted_multipart
  representative_tools:
    - account_lookup
    - transaction_search
    - budget_calculation
endpoint_traffic:
  invoke_deployed_endpoint: true
  application_insights_access: read_only
  direct_trace_injection: forbidden
correlation:
  invocation_response_ids_are_trace_ids: false
  trace_correlation_source: application_insights_operation_id
compatible_scenario_tags:
  - hosted_code
  - authorization
  - correctness
  - tools
