schema_version: "1.0.0"
id: aiq-004-travel
required_name_prefix: aiq-004-travel
display_name: Travel planning
domain: travel
agent_type: hosted_code
status: active
healthy_contract:
  responsibility: Build constrained synthetic itineraries without fabricated inventory or unconfirmed bookings.
  immutable: true
  synthetic_data_only: true
  expected_baseline_insights: 0
implementation:
  source_path: agents/travel-hosted
  version_strategy: immutable_digest
  deployment_protocol: foundry_hosted_multipart
  representative_tools:
    - flight_search
    - hotel_search
    - itinerary
    - booking
endpoint_traffic:
  invoke_deployed_endpoint: true
  application_insights_access: read_only
  direct_trace_injection: forbidden
correlation:
  invocation_response_ids_are_trace_ids: false
  trace_correlation_source: application_insights_operation_id
compatible_scenario_tags:
  - hosted_code
  - grounding
  - planning
  - tools
