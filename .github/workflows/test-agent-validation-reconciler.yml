name: Test Agent Validation cleanup reconciler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: test-agent-validation-account
  cancel-in-progress: false

jobs:
  cleanup-only:
    runs-on: [self-hosted, agent-insights-quality]
    environment: test-agent-validation-shadow
    env:
      AIQ_VALIDATION_STORAGE_ACCOUNT: ${{ vars.AIQ_VALIDATION_STORAGE_ACCOUNT }}
      EXPECTED_AZURE_CLIENT_ID: ${{ vars.AIQ_VALIDATION_CLIENT_ID }}
      HOLDER_WORKFLOW_REFERENCE: ${{ github.workflow_ref }}
      HOLDER_RUN_REFERENCE: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[azure]"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AIQ_VALIDATION_CLIENT_ID }}
          tenant-id: ${{ vars.AIQ_VALIDATION_TENANT_ID }}
          subscription-id: ${{ vars.AIQ_VALIDATION_SUBSCRIPTION_ID }}
      - name: Verify federated Azure identity
        shell: pwsh
        run: |
          python -m agent_insights_quality verify-test-agent-validation-credential `
            --expected-client-id $env:EXPECTED_AZURE_CLIENT_ID
      - name: Reconcile stale lifecycle
        shell: pwsh
        run: |
          $nonce = [guid]::NewGuid().ToString("N")
          python -m agent_insights_quality reconcile-test-agent-validation `
            --storage-account $env:AIQ_VALIDATION_STORAGE_ACCOUNT `
            --ownership-nonce $nonce `
            --holder-workflow-reference $env:HOLDER_WORKFLOW_REFERENCE `
            --holder-app-reference "github-actions" `
            --holder-run-reference $env:HOLDER_RUN_REFERENCE
