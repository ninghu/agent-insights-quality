name: Build ticket agent image

on:
  pull_request:
    paths:
      - agents/support-ticket-hosted-image/container/**
      - .github/workflows/build-ticket-agent.yml
  push:
    branches: [main]
    paths:
      - agents/support-ticket-hosted-image/container/**
      - .github/workflows/build-ticket-agent.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ninghu/agent-insights-quality-ticket

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: agents/support-ticket-hosted-image/container
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE }}:check-${{ github.sha }}

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AIQ_GHCR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: agents/support-ticket-hosted-image/container
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Record immutable image reference
        shell: bash
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
