name: Build ticket agent image

on:
  pull_request:
    paths:
      - agents/support-ticket-hosted-image/container/**
      - .github/workflows/build-ticket-agent.yml
  push:
    branches: [main]
    paths:
      - agents/support-ticket-hosted-image/container/**
      - .github/workflows/build-ticket-agent.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ninghu/agent-insights-quality-ticket

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agents/support-ticket-hosted-image/container
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: agents/support-ticket-hosted-image/container
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
      - name: Record immutable image reference
        shell: bash
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
