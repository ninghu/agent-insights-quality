name: Test Agent Validation protected receipt

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Completed validation cycle ID
        required: true
        type: string
      final_head_sha:
        description: Exact candidate head authorized by the receipt
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
  checks: write

concurrency:
  group: test-agent-validation-account
  cancel-in-progress: false

jobs:
  test-agent-validation:
    runs-on: [self-hosted, agent-insights-quality]
    environment: test-agent-validation-receipt
    env:
      AIQ_RUNTIME_ROOT: ${{ vars.AIQ_RUNTIME_ROOT }}
      AIQ_VALIDATION_STORAGE_ACCOUNT: ${{ vars.AIQ_VALIDATION_STORAGE_ACCOUNT }}
      AIQ_VALIDATION_ENVIRONMENT: test-agent-validation-receipt
      EXPECTED_AZURE_CLIENT_ID: ${{ vars.AIQ_VALIDATION_RECEIPT_CLIENT_ID }}
      EXPECTED_AZURE_OBJECT_ID: ${{ vars.AIQ_VALIDATION_RECEIPT_PRINCIPAL_ID }}
      CYCLE_ID: ${{ inputs.cycle_id }}
      FINAL_HEAD_SHA: ${{ inputs.final_head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.final_head_sha }}
          path: candidate-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[azure]"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AIQ_VALIDATION_RECEIPT_CLIENT_ID }}
          tenant-id: ${{ vars.AIQ_VALIDATION_TENANT_ID }}
          subscription-id: ${{ vars.AIQ_VALIDATION_SUBSCRIPTION_ID }}
      - name: Verify federated Azure identity
        shell: pwsh
        run: |
          python -m agent_insights_quality verify-test-agent-validation-credential `
            --expected-client-id $env:EXPECTED_AZURE_CLIENT_ID
      - name: Construct and issue create-once protected receipt
        shell: pwsh
        run: |
          $root = Join-Path $env:AIQ_RUNTIME_ROOT "test-agent-validation"
          if ($env:CYCLE_ID -notmatch '^[a-z0-9][a-z0-9-]{7,63}$' -or
              $env:FINAL_HEAD_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Receipt construction input is invalid"
          }
          $receipt = Join-Path $root "receipt-requests/$env:FINAL_HEAD_SHA-merge.json"
          python -m agent_insights_quality issue-test-agent-validation-merge-receipt `
            --cycle-id $env:CYCLE_ID `
            --final-head-sha $env:FINAL_HEAD_SHA `
            --candidate-root (Join-Path $env:GITHUB_WORKSPACE "candidate-source") `
            --receipt-output $receipt `
            --storage-account $env:AIQ_VALIDATION_STORAGE_ACCOUNT `
            --expected-azure-client-id $env:EXPECTED_AZURE_CLIENT_ID `
            --expected-azure-object-id $env:EXPECTED_AZURE_OBJECT_ID
