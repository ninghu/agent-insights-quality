name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          code=false
          infra=false
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            git diff --check "$BASE_SHA" HEAD
          else
            git ls-files > "$RUNNER_TEMP/changed-files"
            code=true
          fi
          while IFS= read -r path; do
            case "$path" in
              infra/*) code=true; infra=true ;;
              reports/*|*.md) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline dependencies
        if: steps.changes.outputs.code == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Check Python
        if: steps.changes.outputs.code == 'true'
        run: python -m ruff check src tests agents pyproject.toml
      - name: Run offline tests
        if: steps.changes.outputs.code == 'true'
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest
      - name: Compile changed infrastructure
        if: steps.changes.outputs.infra == 'true'
        run: |
          az bicep build --file infra/main.bicep --stdout >/dev/null
          az bicep build --file infra/assessment-models.bicep --stdout >/dev/null
          az bicep build --file infra/analytics.bicep --stdout >/dev/null
      - name: Offline validation complete
        run: echo "No cloud calls, Hosted SDK installs, or container builds are part of this job."
