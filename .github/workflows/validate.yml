name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,azure]"
      - run: python -m agent_insights_quality validate
      - run: python -m ruff check .
      - run: python -m pytest
      - run: az bicep build --file infra/main.bicep --stdout >/dev/null

  agent-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [finance-agent, travel-agent, support-ticket-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and import Agent
        working-directory: agents/${{ matrix.agent }}/v0
        env:
          FOUNDRY_AGENT_NAME: ${{ matrix.agent }}-validation
          FOUNDRY_AGENT_VERSION: validation-build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall source
          python -c "import source.app"

  validate:
    if: always()
    needs: [contracts, agent-builds]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation dependency
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          AGENT_BUILDS_RESULT: ${{ needs.agent-builds.result }}
        run: |
          test "$CONTRACTS_RESULT" = "success"
          test "$AGENT_BUILDS_RESULT" = "success"
