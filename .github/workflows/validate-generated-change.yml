name: Validate generated change

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-generated-paths:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'aiq-daily/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted validator
        run: python -m pip install -e .
      - name: Fetch generated head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/generated/head"
          test "$(git rev-parse refs/remotes/generated/head)" = "${HEAD_SHA}"
      - name: Enforce generated paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' status; do
            IFS= read -r -d '' first_path
            args+=("--path=${first_path}")
            if [[ "${status}" == R* || "${status}" == C* ]]; then
              IFS= read -r -d '' second_path
              args+=("--path=${second_path}")
            fi
          done < <(
            git diff --name-status -z --find-renames --diff-filter=ACMRTD \
              "${BASE_SHA}...${HEAD_SHA}"
          )
          test "${#args[@]}" -gt 0
          python -m agent_insights_quality validate-generated-paths "${args[@]}"
      - name: Verify trusted report and receipt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t report_paths < <(
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
              | grep -E '^reports/daily/[0-9]{4}/[0-9]{2}/[0-9]{2}/report.json$' || true
          )
          mapfile -t receipt_paths < <(
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
              | grep -E '^reports/daily/[0-9]{4}/[0-9]{2}/[0-9]{2}/email-receipt.json$' || true
          )
          test "${#report_paths[@]}" -eq 1
          test "${#receipt_paths[@]}" -eq 1
          report_path="${report_paths[0]}"
          receipt_path="${receipt_paths[0]}"
          test "${receipt_path}" = "${report_path%report.json}email-receipt.json"
          report_md_path="${report_path%report.json}report.md"
          for required_path in \
            "${report_md_path}" \
            "reports/latest.json" \
            "reports/latest.md" \
            "reports/trend.json" \
            "reports/insight-engine-improvement.json" \
            "reports/insight-engine-improvement.md" \
            "${report_path%report.json}insight-engine-improvement.json" \
            "${report_path%report.json}insight-engine-improvement.md"; do
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Fx "${required_path}"
          done
          agent_args=()
          for agent in \
            weather-agent \
            healthcare-agent \
            finance-agent \
            travel-agent \
            support-ticket-agent; do
            agent_path="${report_path%report.json}agents/${agent}.md"
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Fx "${agent_path}"
            git show "${HEAD_SHA}:${agent_path}" > "${RUNNER_TEMP}/${agent}.md"
            agent_args+=("--agent-report" "${RUNNER_TEMP}/${agent}.md")
          done
          git show "${HEAD_SHA}:${report_path}" > "${RUNNER_TEMP}/report.json"
          git show "${HEAD_SHA}:${receipt_path}" > "${RUNNER_TEMP}/email-receipt.json"
          git show "${HEAD_SHA}:${report_md_path}" > "${RUNNER_TEMP}/report.md"
          git show "${HEAD_SHA}:reports/latest.json" > "${RUNNER_TEMP}/latest.json"
          git show "${HEAD_SHA}:reports/latest.md" > "${RUNNER_TEMP}/latest.md"
          git show "${HEAD_SHA}:reports/trend.json" > "${RUNNER_TEMP}/trend.json"
          git show "${HEAD_SHA}:reports/insight-engine-improvement.json" \
            > "${RUNNER_TEMP}/insight-engine-improvement.json"
          git show "${HEAD_SHA}:reports/insight-engine-improvement.md" \
            > "${RUNNER_TEMP}/insight-engine-improvement.md"
          git show "${HEAD_SHA}:${report_path%report.json}insight-engine-improvement.json" \
            > "${RUNNER_TEMP}/insight-engine-improvement-snapshot.json"
          git show "${HEAD_SHA}:${report_path%report.json}insight-engine-improvement.md" \
            > "${RUNNER_TEMP}/insight-engine-improvement-snapshot.md"
          git show "${BASE_SHA}:reports/trend.json" > "${RUNNER_TEMP}/base-trend.json"
          git show "${BASE_SHA}:reports/insight-engine-improvement.json" \
            > "${RUNNER_TEMP}/base-insight-engine-improvement.json"
          git show "${BASE_SHA}:reports/insight-engine-improvement.md" \
            > "${RUNNER_TEMP}/base-insight-engine-improvement.md"
          current_snapshot_json="${report_path%report.json}insight-engine-improvement.json"
          current_snapshot_md="${report_path%report.json}insight-engine-improvement.md"
          for current_snapshot in "${current_snapshot_json}" "${current_snapshot_md}"; do
            if git cat-file -e "${BASE_SHA}:${current_snapshot}" 2>/dev/null; then
              echo "Current improvement snapshot already exists in trusted base: ${current_snapshot}" >&2
              exit 1
            fi
          done
          while IFS=$'\t' read -r status path; do
            case "${path}" in
              reports/daily/*/insight-engine-improvement.json|reports/daily/*/insight-engine-improvement.md)
                if [[ "${path}" != "${current_snapshot_json}" && "${path}" != "${current_snapshot_md}" ]]; then
                  echo "Existing improvement snapshot changed or was deleted: ${status} ${path}" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(git diff --no-renames --name-status "${BASE_SHA}...${HEAD_SHA}")
          python -m agent_insights_quality validate-published-report \
            --report "${RUNNER_TEMP}/report.json" \
            --receipt "${RUNNER_TEMP}/email-receipt.json" \
            --report-relative-path "${report_path}" \
            --report-markdown "${RUNNER_TEMP}/report.md" \
            --latest-json "${RUNNER_TEMP}/latest.json" \
            --latest-markdown "${RUNNER_TEMP}/latest.md" \
            --trend "${RUNNER_TEMP}/trend.json" \
            --base-trend "${RUNNER_TEMP}/base-trend.json" \
            --improvement-json "${RUNNER_TEMP}/insight-engine-improvement.json" \
            --improvement-markdown "${RUNNER_TEMP}/insight-engine-improvement.md" \
            --base-improvement-json "${RUNNER_TEMP}/base-insight-engine-improvement.json" \
            --base-improvement-markdown "${RUNNER_TEMP}/base-insight-engine-improvement.md" \
            --improvement-snapshot-json "${RUNNER_TEMP}/insight-engine-improvement-snapshot.json" \
            --improvement-snapshot-markdown "${RUNNER_TEMP}/insight-engine-improvement-snapshot.md" \
            "${agent_args[@]}"
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
