name: Validate generated change

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-generated-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Read generated data without executing the head
        id: reports
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/generated/head"
          test "$(git rev-parse refs/remotes/generated/head)" = "$HEAD_SHA"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/all-paths"
          grep -E '^(reports/latest\.(json|md)|reports/daily/[0-9]{4}/[0-9]{2}/[0-9]{2}/report\.(json|md))$' \
            "$RUNNER_TEMP/all-paths" > "$RUNNER_TEMP/matched-paths" || test "$?" -eq 1
          sed 's/\.md$/.json/' "$RUNNER_TEMP/matched-paths" | sort -u > "$RUNNER_TEMP/report-paths"
          count=$(wc -l < "$RUNNER_TEMP/report-paths")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          index=0
          while IFS= read -r path; do
            git show "$HEAD_SHA:$path" > "$RUNNER_TEMP/report-$index.json"
            git show "$HEAD_SHA:${path%.json}.md" > "$RUNNER_TEMP/report-$index.md"
            printf '%s' "$path" > "$RUNNER_TEMP/report-$index.path"
            index=$((index + 1))
          done < "$RUNNER_TEMP/report-paths"
      - uses: actions/setup-python@v5
        if: steps.reports.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install trusted offline validator
        if: steps.reports.outputs.count != '0'
        run: python -m pip install -e .
      - name: Validate report values and deterministic rendering
        if: steps.reports.outputs.count != '0'
        env:
          REPORT_COUNT: ${{ steps.reports.outputs.count }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          for ((index=0; index<REPORT_COUNT; index++)); do
            python -m agent_insights_quality.public_artifacts \
              "$RUNNER_TEMP/report-$index.json" \
              --markdown "$RUNNER_TEMP/report-$index.md" \
              --repository-path "$(cat "$RUNNER_TEMP/report-$index.path")"
          done
