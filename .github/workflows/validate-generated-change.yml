name: Validate repository contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate schemas, manifests, docs, policy, and security
        run: python -m agent_insights_quality validate
      - name: Test
        run: python -m pytest
      - name: Enforce generated-only automation changes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'aiq-daily/')
        run: python -m agent_insights_quality validate-generated-paths --base-ref "origin/${{ github.base_ref }}"
