name: Validate generated change paths

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-generated-paths:
    if: startsWith(github.event.pull_request.head.ref, 'aiq-daily/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce paths with trusted base code and policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base_dir="${RUNNER_TEMP}/aiq-base"
          base_venv="${RUNNER_TEMP}/aiq-base-venv"
          head_ref="refs/remotes/aiq-pr/${PR_NUMBER}/head"

          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:${head_ref}"
          test "$(git rev-parse "${head_ref}")" = "${HEAD_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git worktree add --detach "${base_dir}" "${BASE_SHA}"
          python -m venv "${base_venv}"
          "${base_venv}/bin/python" -m pip install -e "${base_dir}"

          args=()
          while IFS= read -r -d '' status; do
            IFS= read -r -d '' first_path
            args+=("--path=${first_path}")
            if [[ "${status}" == R* || "${status}" == C* ]]; then
              IFS= read -r -d '' second_path
              args+=("--path=${second_path}")
            fi
          done < <(
            git diff --name-status -z --find-renames --diff-filter=ACMRTD \
              "${BASE_SHA}...${HEAD_SHA}"
          )

          if [[ "${#args[@]}" -eq 0 ]]; then
            echo "Generated pull request contains no changed paths." >&2
            exit 1
          fi

          cd "${base_dir}"
          "${base_venv}/bin/python" -m agent_insights_quality \
            validate-generated-paths "${args[@]}"
