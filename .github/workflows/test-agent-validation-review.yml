name: Test Agent Validation review attestation

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Frozen validation cycle ID
        required: true
        type: string
      frozen_head_sha:
        description: Exact frozen candidate head reviewed
        required: true
        type: string
      findings_digest:
        description: SHA-256 digest of the private comprehensive review result
        required: true
        type: string

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: test-agent-validation-account
  cancel-in-progress: false

jobs:
  review-attestation:
    name: test-agent-validation-review
    runs-on: [self-hosted, agent-insights-quality]
    environment: test-agent-validation-review
    env:
      AIQ_VALIDATION_STORAGE_ACCOUNT: ${{ vars.AIQ_VALIDATION_STORAGE_ACCOUNT }}
      EXPECTED_AZURE_CLIENT_ID: ${{ vars.AIQ_VALIDATION_RECEIPT_CLIENT_ID }}
      EXPECTED_AZURE_OBJECT_ID: ${{ vars.AIQ_VALIDATION_RECEIPT_PRINCIPAL_ID }}
      CYCLE_ID: ${{ inputs.cycle_id }}
      FROZEN_HEAD_SHA: ${{ inputs.frozen_head_sha }}
      FINDINGS_DIGEST: ${{ inputs.findings_digest }}
      AIQ_VALIDATION_ENVIRONMENT: test-agent-validation-review
      HOLDER_WORKFLOW_REFERENCE: ${{ github.workflow_ref }}
      HOLDER_RUN_REFERENCE: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[azure]"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AIQ_VALIDATION_RECEIPT_CLIENT_ID }}
          tenant-id: ${{ vars.AIQ_VALIDATION_TENANT_ID }}
          subscription-id: ${{ vars.AIQ_VALIDATION_SUBSCRIPTION_ID }}
      - name: Verify federated Azure identity
        shell: pwsh
        run: |
          python -m agent_insights_quality verify-test-agent-validation-credential `
            --expected-client-id $env:EXPECTED_AZURE_CLIENT_ID
      - name: Attest frozen comprehensive review
        shell: pwsh
        run: |
          $summary = python -m agent_insights_quality attest-test-agent-validation-review `
            --storage-account $env:AIQ_VALIDATION_STORAGE_ACCOUNT `
            --expected-azure-client-id $env:EXPECTED_AZURE_CLIENT_ID `
            --expected-azure-object-id $env:EXPECTED_AZURE_OBJECT_ID `
            --cycle-id $env:CYCLE_ID `
            --frozen-head-sha $env:FROZEN_HEAD_SHA `
            --findings-digest $env:FINDINGS_DIGEST
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
