instructions: |
  This is a public repository. Use only synthetic data and public-safe configuration.
  Never commit credentials, private Azure identifiers, internal endpoints, raw traces,
  complete prompt payloads, private work-item content, or real customer data.
  Test traffic must invoke deployed Agent endpoints.
  Application Insights is read-only and direct trace injection is forbidden.
  Python orchestrates staging and Daily, including concurrency, checkpoints and direct Sol
  assessment. App automation launches one runner command and sends only the exact prepared
  email request through its native mail capability. It does not orchestrate or assess tests.
  Staging is incremental and report-free: no monitor or Agent Insights run.
  Do not enable automation or publish official results during the private TEST email trial.
  Treat AGENT_CATALOG.yaml and ISSUE_CATALOG.yaml as human-reviewed contracts.
  Follow the repository-wide maintenance and evidence rules in AGENTS.md.

scripts:
  - name: Validate repository contracts
    command: python -m agent_insights_quality validate
  - name: Run tests
    command: python -m pytest
  - name: Run Ruff
    command: python -m ruff check src tests agents pyproject.toml

automation:
  auto_issue_session: true
  remote_control: false
