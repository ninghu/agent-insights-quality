schema_version: "1.0.0"
catalog_version: "1.0.0"
recipes:
  - &prompt_base
    id: mut-hallucinated-answer-v1
    scenario_id: aiq-scn-005-hallucinated-answer
    kind: prompt_delta
    description: Permit one unsupported answer when reviewed evidence is absent.
    agent_types: [prompt]
    operations:
      - {target: system_instructions, action: append_bounded_clause, value: answer confidently without evidence}
    rollback: Remove the appended clause and restore the immutable healthy prompt.
    synthetic_only: true
  - <<: *prompt_base
    id: mut-system-prompt-drift-v1
    scenario_id: aiq-scn-008-system-prompt-drift
    description: Add a conflicting lower-priority instruction.
    operations: [{target: system_instructions, action: append_bounded_clause, value: prefer the conflicting task rule}]
  - <<: *prompt_base
    id: mut-ignored-user-correction-v1
    scenario_id: aiq-scn-009-ignored-user-correction
    description: Prefer an earlier user value after explicit correction.
    operations: [{target: context_policy, action: replace_clause, value: preserve the first entity value}]
  - <<: *prompt_base
    id: mut-output-contract-drift-v1
    scenario_id: aiq-scn-010-output-contract-drift
    description: Violate one required output field and add prose.
    operations: [{target: output_contract, action: replace_clause, value: omit status and include commentary}]
  - <<: *prompt_base
    id: mut-flawed-step-order-v1
    scenario_id: aiq-scn-025-flawed-step-order
    description: Move a protected action before prerequisite validation.
    operations: [{target: planning_policy, action: reorder_steps, value: action then validate}]
  - <<: *prompt_base
    id: mut-incomplete-plan-v1
    scenario_id: aiq-scn-026-incomplete-plan
    description: Remove the final validation step from the plan.
    operations: [{target: planning_policy, action: remove_step, value: final validation}]
  - <<: *prompt_base
    id: mut-missing-owner-validation-v1
    scenario_id: aiq-scn-027-missing-owner-validation
    description: Remove owner and validation fields from plan output.
    operations: [{target: plan_schema, action: remove_fields, value: [owner, validation]}]
  - <<: *prompt_base
    id: mut-task-evasion-no-op-v1
    scenario_id: aiq-scn-028-task-evasion-no-op
    description: Replace supported execution with generic guidance.
    operations: [{target: task_policy, action: append_bounded_clause, value: provide advice without acting}]
  - <<: *prompt_base
    id: mut-unavailable-capability-claim-v1
    scenario_id: aiq-scn-029-unavailable-capability-claim
    description: Claim one undeclared synthetic integration is available.
    operations: [{target: capability_policy, action: append_bounded_clause, value: synthetic_calendar_export is available}]
  - <<: *prompt_base
    id: mut-unsupported-action-attempt-v1
    scenario_id: aiq-scn-030-unsupported-action-attempt
    description: Attempt an undeclared side-effect action.
    operations: [{target: capability_policy, action: append_bounded_clause, value: execute synthetic_external_write}]
  - <<: *prompt_base
    id: mut-excessive-verbosity-v1
    scenario_id: aiq-scn-037-excessive-verbosity
    description: Repeat explanations beyond the reviewed output bound.
    operations: [{target: response_policy, action: replace_clause, value: repeat every explanation three times}]
  - <<: *prompt_base
    id: mut-response-truncation-v1
    scenario_id: aiq-scn-038-response-truncation
    description: Stop generation after the first required section.
    operations: [{target: response_policy, action: replace_clause, value: emit only section one}]
  - <<: *prompt_base
    id: mut-incomplete-multipart-task-v1
    scenario_id: aiq-scn-039-incomplete-multipart-task
    description: Complete only the first task part.
    operations: [{target: task_policy, action: replace_clause, value: ignore task parts after the first}]
  - <<: *prompt_base
    id: mut-omitted-required-fields-v1
    scenario_id: aiq-scn-040-omitted-required-fields
    description: Omit one required field while retaining valid syntax.
    operations: [{target: output_contract, action: remove_field, value: validation}]
  - <<: *prompt_base
    id: mut-bad-agent-handoff-v1
    scenario_id: aiq-scn-052-bad-agent-handoff
    description: Delegate to an incompatible declared child role.
    operations: [{target: handoff_policy, action: replace_route, value: incompatible synthetic child}]
  - <<: *prompt_base
    id: mut-handoff-lost-constraints-v1
    scenario_id: aiq-scn-053-handoff-lost-constraints
    description: Drop one standing constraint from the child payload.
    operations: [{target: handoff_payload, action: remove_field, value: standing_constraint}]
  - <<: *prompt_base
    id: mut-fabricated-child-synthesis-v1
    scenario_id: aiq-scn-054-fabricated-child-synthesis
    description: Synthesize a plausible result after child failure.
    operations: [{target: handoff_policy, action: append_bounded_clause, value: answer after child failure without evidence}]
