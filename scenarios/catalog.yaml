    family: grounding_correctness
    priority: P1
    customer_impact: Detect a final response that contradicts a successful authoritative synthetic tool result.
    tags: [grounding, hallucination, tools]
    compatibility: &hosted_agents
      domains: [weather, healthcare, finance, travel, support_ticket]
      agent_types: [hosted_code, hosted_custom_container]
      agent_ids: []
    conflict_tags: [grounding-root]
    mutation: {kind: source_patch, manifest: scenarios/mutations/runtime-variants.yaml, recipe_id: mut-tool-output-contradiction-v1, healthy_to_fault_delta: Replace the grounded response mapping with a contradictory deterministic value.}
    traffic: {recipe: scenarios/traffic/catalog.yaml, recipe_id: traffic-tool-output-contradiction-v1, seed_namespace: tool-output-contradiction-v1, minimum_requests: 5}
    evidence: &tool_evidence
      expected_spans: [agent, model, tool]
      expected_tool_calls: [synthetic_tool]
      minimum_evidence_count: 3
      negative_controls: [successful tool responses used correctly]
    expected:
      root_cause: The final answer contradicts a successful authoritative tool result.
      category: hallucinations
      severity: high
      validation_targets: *standard_targets
      fix: {kind: code_change, boundary: Preserve authoritative tool values through response synthesis.}
    version_semantics: *injected_version

