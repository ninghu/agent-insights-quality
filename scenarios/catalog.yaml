schema_version: "1.0.0"
catalog_version: "1.0.0"
scenarios:
  - &scenario_base
    id: aiq-scn-001-fully-healthy
    version: "1.0.0"
    status: active
    title: Fully healthy endpoint control
    family: healthy_controls
    priority: P0
    customer_impact: Prevent ordinary successful agent behavior from generating customer-visible noise.
    tags: [healthy, control, baseline]
    compatibility: &all_agents
      domains: [weather, healthcare, finance, travel, support_ticket]
      agent_types: [prompt, hosted_code, hosted_custom_container]
      agent_ids: []
    conflict_tags: [healthy-control]
    mutation:
      kind: none
      manifest: null
      recipe_id: null
      healthy_to_fault_delta: No mutation; invoke the immutable healthy deployment.
    traffic:
      recipe: scenarios/traffic/catalog.yaml
      recipe_id: traffic-fully-healthy-v1
      seed_namespace: fully-healthy-v1
      minimum_requests: 3
    evidence: &healthy_evidence
      expected_spans: [agent, model, tool]
      expected_tool_calls: [synthetic_operation]
      minimum_evidence_count: 3
      negative_controls: [ordinary successful endpoint traces]
    expected:
      root_cause: No defect is present in the healthy control.
      category: none
      severity: none
      validation_targets: &healthy_targets [no_insight, evidence]
      fix:
        kind: no_fix
        boundary: No product or agent change is expected.
    recurrence: &default_recurrence
      identity_scope: root_cause_version
      dedup_behavior: Emit at most one finding for one independently fixable root cause.
      recurrence_behavior: Reappearance after a corrected immutable version is a recurrence.
    healthy_decoys: &default_decoys
      - ordinary model latency
      - expected synthetic tool payloads
    version_semantics: &current_version
      applies_to: current_immutable_version
      phases: [healthy]
      version_keys: [healthy]
      prior_insight_behavior: Current evidence must not reuse findings from another immutable version.
    retirement: null

  - <<: *scenario_base
    id: aiq-scn-002-expected-model-latency
    title: Expected model latency control
    customer_impact: Prevent bounded model processing time from being mislabeled as avoidable latency.
    tags: [healthy, control, latency]
    traffic: {recipe: scenarios/traffic/catalog.yaml, recipe_id: traffic-expected-model-latency-v1, seed_namespace: expected-model-latency-v1, minimum_requests: 3}
    expected:
      root_cause: No defect is present when model latency remains within the reviewed bound.
      category: none
      severity: none
      validation_targets: *healthy_targets
      fix: {kind: no_fix, boundary: No latency optimization is expected for bounded model work.}

  - <<: *scenario_base
    id: aiq-scn-003-handled-transient-failure
    title: Handled transient failure control
    customer_impact: Prevent successful bounded recovery from being reported as an unhandled reliability defect.
    tags: [healthy, control, recovery]
    traffic: {recipe: scenarios/traffic/catalog.yaml, recipe_id: traffic-handled-transient-failure-v1, seed_namespace: handled-transient-failure-v1, minimum_requests: 4}
    expected:
      root_cause: No defect is present when one transient failure is recovered with a bounded retry.
      category: none
      severity: none
      validation_targets: *healthy_targets
      fix: {kind: no_fix, boundary: Preserve the reviewed bounded retry behavior.}

  - <<: *scenario_base
    id: aiq-scn-004-ordinary-token-use
    title: Ordinary token use control
    customer_impact: Prevent normal context and response token use from producing cost-noise findings.
    tags: [healthy, control, cost]
    traffic: {recipe: scenarios/traffic/catalog.yaml, recipe_id: traffic-ordinary-token-use-v1, seed_namespace: ordinary-token-use-v1, minimum_requests: 3}
    expected:
      root_cause: No defect is present when token use stays within the reviewed task budget.
      category: none
      severity: none
      validation_targets: *healthy_targets
      fix: {kind: no_fix, boundary: No context reduction is expected for ordinary task content.}

  - <<: *scenario_base
    id: aiq-scn-005-hallucinated-answer
    title: Hallucinated unsupported answer
    family: grounding_correctness
    priority: P1
    customer_impact: Detect a confident answer that is unsupported by synthetic source data or tool evidence.
    tags: [grounding, hallucination, prompt]
    compatibility: &prompt_agents
      domains: [weather, healthcare, finance, travel, support_ticket]
      agent_types: [prompt]
      agent_ids: []
    conflict_tags: [grounding-root]
    mutation: {kind: prompt_delta, manifest: scenarios/mutations/prompt-deltas.yaml, recipe_id: mut-hallucinated-answer-v1, healthy_to_fault_delta: Add a bounded instruction that permits an unsupported answer when evidence is absent.}
    traffic: {recipe: scenarios/traffic/catalog.yaml, recipe_id: traffic-hallucinated-answer-v1, seed_namespace: hallucinated-answer-v1, minimum_requests: 5}
    evidence: &model_evidence
      expected_spans: [agent, model]
      expected_tool_calls: []
      minimum_evidence_count: 3
      negative_controls: [supported statements from healthy traces]
    expected:
      root_cause: The agent invents a factual answer that is absent from all available synthetic evidence.
      category: hallucinations
      severity: high
      validation_targets: &standard_targets [root_cause, title, description, category, severity, proposed_fix, evidence]
      fix: {kind: prompt_patch, boundary: Require evidence-grounded answers and an explicit unknown response.}
    version_semantics: &injected_version
      applies_to: injected_immutable_version
      phases: [faulted]
      version_keys: [faulted]
      prior_insight_behavior: Attribute the finding only to the injected immutable version and its window.

